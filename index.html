<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>光影立方 LIGHT CUBE · AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --blue:#2660A4; --orange:#FF9505; --black:#000; --paper:#F6F4EF; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; color:var(--paper);
    font-family:'Noto Sans TC', sans-serif; -webkit-tap-highlight-color:transparent; }
  #ar { position:fixed; inset:0; }

  /* ---------- start screen ---------- */
  #start { position:fixed; inset:0; z-index:20; background:var(--paper); color:#000;
    display:flex; flex-direction:column; justify-content:space-between; padding:28px 22px; box-sizing:border-box; }
  #start .frame { position:absolute; inset:14px; border:1.5px solid #000; pointer-events:none; }
  #start .top { display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:12px; letter-spacing:2px; position:relative; }
  #start h1 { position:relative; margin:0; font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(64px, 22vw, 120px); line-height:.9; letter-spacing:-3px;
    text-shadow:-6px 0 0 var(--orange), 6px 0 0 var(--blue); }
  #start h2 { position:relative; margin:14px 0 0; font-size:28px; font-weight:900; letter-spacing:2px; }
  #start p { position:relative; margin:10px 0 0; font-size:15px; line-height:1.6; font-weight:700; }
  #start .hl { background:#000; color:var(--paper); padding:0 5px; }
  #go { position:relative; appearance:none; border:0; background:#000; color:var(--paper);
    font-family:'Noto Sans TC', sans-serif; font-weight:900; font-size:20px; letter-spacing:2px;
    min-height:60px; width:100%; cursor:pointer; box-shadow:6px 6px 0 var(--orange); }
  #go:active { transform:translate(3px,3px); box-shadow:3px 3px 0 var(--orange); }
  #go[disabled] { opacity:.6; }
  .bars { position:relative; height:6px; background:var(--orange); margin:18px 0; }
  .small { position:relative; font-family:'Space Mono', monospace; font-size:11px; margin-top:12px; text-align:center; }

  /* ---------- scanning overlay ---------- */
  #scan { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #scan.on { display:flex; }
  #scan .box { position:relative; width:min(66vw, 46vh); aspect-ratio:600/888; border:1.5px solid rgba(246,244,239,.85); }
  #scan .box i { position:absolute; width:12px; height:12px; background:var(--paper); border:1.5px solid #000; box-sizing:border-box; }
  #scan .box i:nth-child(1){left:-7px;top:-7px} #scan .box i:nth-child(2){right:-7px;top:-7px}
  #scan .box i:nth-child(3){left:-7px;bottom:-7px} #scan .box i:nth-child(4){right:-7px;bottom:-7px}
  #scan .line { position:absolute; left:0; right:0; height:3px; background:var(--orange); animation:sweep 2.2s linear infinite; }
  @keyframes sweep { from { top:0 } to { top:100% } }
  #scan .label { position:absolute; left:50%; bottom:calc(50% - min(66vw,46vh)*0.74 - 52px); transform:translateX(-50%);
    background:#000; color:var(--paper); font-weight:900; font-size:15px; letter-spacing:1px; padding:8px 12px; white-space:nowrap; }

  /* ---------- message ---------- */
  #msg { position:fixed; left:16px; right:16px; top:16px; max-height:70vh; overflow:auto; z-index:30; display:none; background:#000; color:var(--paper);
    border:1.5px solid var(--orange); padding:14px 16px; font-size:14px; line-height:1.6; font-weight:700; }
  #msg.on { display:block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="ar"></div>

<section id="start">
  <div class="frame"></div>
  <div class="top"><span>115 學年度</span><span>2026.12.05—12.19</span></div>
  <div>
    <h1>LIGHT<br>CUBE</h1>
    <h2>光影立方・AR</h2>
    <p>開啟相機，把鏡頭對準 <span class="hl">酷卡正面</span>，<br>立方體會從卡片裡浮出來。</p>
  </div>
  <div>
    <div class="bars"></div>
    <button id="go" type="button">開啟相機 START AR</button>
    <div class="small">需允許相機權限｜治平高中 商業與管理群 多媒體技術科</div>
  </div>
</section>

<div id="scan" aria-live="polite">
  <div class="box"><i></i><i></i><i></i><i></i><div class="line"></div></div>
  <div class="label">將鏡頭對準酷卡正面</div>
</div>

<div id="msg" role="alert"></div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

/* ================= CONFIG (可自行調整) ================= */
const CONFIG = {
  target: './targets.mind',   // 用酷卡正面編譯出的辨識檔
  depth: 1.8,                 // 分層深度倍率：1 = 原本，2 = 兩倍立體
  cubeSize: 0.12,             // 立方體大小（1 = 卡片寬度）
  cubeLift: 0.16,             // 立方體浮出卡面的高度
  sway: 0.45,                 // 立方體左右擺動幅度 (rad)
  explodeEvery: 6,            // 立方體爆開重組的間隔（秒）
  glitchEvery: [1.0, 2.4],    // 故障閃爍間隔（秒，隨機範圍）
  particles: 240,             // 數位粒子數量
};
const COL = { blue: 0x2660A4, orange: 0xFF9505, black: 0x000000, paper: 0xF6F4EF };
const HEX = { blue: '#2660A4', orange: '#FF9505', black: '#000000', paper: '#F6F4EF', grid: '#E4EBF4' };
/* ======================================================= */

const $ = (s) => document.querySelector(s);
const showMsg = (t) => { const m = $('#msg'); m.textContent = t; m.classList.add('on'); };

/* ---------- card space helpers (design px 600×888 → card units, width = 1) ---------- */
const CW = 600, CH = 888, HALF_H = CH / CW / 2;   // 0.74
const toCard = (x, y, w, h) => ({ cx: (x + w / 2) / CW - 0.5, cy: HALF_H - (y + h / 2) / CW, w: w / CW, h: h / CW });
const PX = 3; // canvas pixels per design px

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * PX); c.height = Math.ceil(h * PX);
  const g = c.getContext('2d'); g.scale(PX, PX);
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const setLS = (g, v) => { if ('letterSpacing' in g) g.letterSpacing = v + 'px'; };

async function loadFonts() {
  try {
    await Promise.all([
      document.fonts.load('900 172px "Noto Sans TC"'), document.fonts.load('700 13px "Noto Sans TC"'),
      document.fonts.load('500 13px "Noto Sans TC"'),  document.fonts.load('700 58px "Space Grotesk"'),
      document.fonts.load('700 17px "Space Mono"'),    document.fonts.load('400 11px "Space Mono"'),
    ]);
  } catch (e) {}
}

/* ---------- textures for each card element ---------- */
function hatchTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = HEX.paper; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#000'; g.lineWidth = 7;
  for (let i = -128; i < 256; i += 18) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 128, 128); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const gridTex = (w, h) => canvasTex(w, h, (g) => {
  g.fillStyle = HEX.grid; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(38,96,164,.38)'; g.lineWidth = 1;
  for (let x = 0.5; x < w; x += 12) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 0.5; y < h; y += 12) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
});
const ringTex = (w, h) => canvasTex(w, h, (g) => {
  const cx = w * 0.46, cy = h * 0.52;
  g.strokeStyle = '#000'; g.lineWidth = 1.6;
  for (let r = 0.8; r < Math.hypot(w, h); r += 5.5) { g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke(); }
  g.globalCompositeOperation = 'destination-in';
  g.save(); g.translate(w / 2, h / 2); g.scale(1, h / w);
  const grd = g.createRadialGradient(0, 0, 0, 0, 0, w / 2);
  grd.addColorStop(0, 'rgba(0,0,0,.9)'); grd.addColorStop(0.55, 'rgba(0,0,0,.9)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(-w, -w, w * 2, w * 2); g.restore();
});
const scanTex = (w, h) => canvasTex(w, h, (g) => {
  g.fillStyle = HEX.orange; g.fillRect(0, 0, w, h);
  g.fillStyle = '#000'; for (let y = h - 2; y > -2; y -= 5) g.fillRect(0, y, w, 2);
});
const checkTex = (w, h) => canvasTex(w, h, (g) => {
  g.fillStyle = '#000';
  for (let y = 0; y < h; y += 14) for (let x = 0; x < w; x += 14) if (((x + y) / 14) % 2 === 0) g.fillRect(x, y, 14, 14);
});
const dotsTex = (vertical, colors) => {
  const w = vertical ? 9 : 39, h = vertical ? 39 : 9;
  return canvasTex(w, h, (g) => colors.forEach((c, i) => {
    g.fillStyle = c; g.beginPath();
    g.arc(vertical ? 4.5 : 4.5 + i * 15, vertical ? 4.5 + i * 15 : 4.5, 4.5, 0, Math.PI * 2); g.fill();
  }));
};
const crossTex = (s, bold) => canvasTex(s, s, (g) => {
  g.strokeStyle = '#000'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(s / 2, 0); g.lineTo(s / 2, s); g.moveTo(0, s / 2); g.lineTo(s, s / 2); g.stroke();
  if (bold) { g.lineWidth = 2.5; const k = s * 4 / 36; g.beginPath(); g.moveTo(s / 2 - k, s / 2); g.lineTo(s / 2 + k, s / 2); g.moveTo(s / 2, s / 2 - k); g.lineTo(s / 2, s / 2 + k); g.stroke(); }
});
const textTex = (w, h, text, font, color, ls = 0, opts = {}) => canvasTex(w, h, (g) => {
  g.font = font; g.fillStyle = color; setLS(g, ls); g.textBaseline = 'alphabetic';
  if (opts.rotate) { g.translate(w / 2, h / 2); g.rotate(opts.rotate); g.translate(-h / 2, -w / 2); }
  g.fillText(text, opts.x || 0, opts.y || h * 0.8);
});
// big title: one colour, optional glitch slice
const titleTex = (w, h, text, color, slice) => canvasTex(w, h, (g) => {
  g.font = '900 172px "Noto Sans TC", sans-serif'; setLS(g, -8); g.fillStyle = color;
  g.fillText(text, 0, 158);
  if (slice) {
    g.save(); g.beginPath(); g.rect(0, 172 * slice.top, w, 172 * slice.size); g.clip();
    g.fillStyle = HEX.paper; g.fillRect(0, 0, w, h);
    g.fillStyle = color; g.fillText(text, slice.dx, 158); g.restore();
  }
});
const dateTex = () => canvasTex(200, 120, (g) => {
  const R = 200;
  g.textAlign = 'right'; g.fillStyle = '#000';
  g.font = '700 58px "Space Grotesk", sans-serif'; setLS(g, -2); g.fillText('2026', R, 50);
  setLS(g, 0); g.font = '700 17px "Space Mono", monospace';
  const d = '12.05 — 12.19', tw = g.measureText(d).width + 16;
  g.fillStyle = '#000'; g.fillRect(R - tw, 58, tw, 25);
  g.fillStyle = HEX.paper; g.fillText(d, R - 8, 76);
  g.fillStyle = '#000'; g.font = '700 13px "Noto Sans TC", sans-serif'; setLS(g, 2); g.fillText('115 學年度', R, 106);
});
const frameTex = () => canvasTex(576, 774, (g) => {
  g.strokeStyle = '#000'; g.lineWidth = 1.5; g.strokeRect(6.75, 6.75, 562.5, 760.5);
  [[0, 0], [282, 0], [564, 0], [0, 381], [564, 367], [0, 762], [282, 762], [564, 762]].forEach(([x, y]) => {
    g.fillStyle = HEX.paper; g.fillRect(x, y, 12, 12); g.strokeRect(x + .75, y + .75, 10.5, 10.5);
  });
});
const footerTex = () => canvasTex(564, 64, (g) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64);
  const cube = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x + 12, y + 12) : g.moveTo(x + 12, y + 12)); g.fill(); };
  cube([[20, 4], [34, 12], [20, 20], [6, 12]], HEX.orange);
  cube([[6, 12], [20, 20], [20, 36], [6, 28]], HEX.blue);
  cube([[20, 20], [34, 12], [34, 28], [20, 36]], HEX.paper);
  const hl = (x, y, txt, bg, fg) => { const tw = g.measureText(txt).width; g.fillStyle = bg; g.fillRect(x, y - 14, tw + 8, 18); g.fillStyle = fg; g.fillText(txt, x + 4, y); return tw + 8; };
  g.font = '700 13px "Noto Sans TC", sans-serif';
  let x = 76; x += hl(x, 27, '光影立方', '#000', HEX.paper); g.fillStyle = '#000'; g.fillText(' LIGHT CUBE 光雕展', x, 27);
  g.font = '500 13px "Noto Sans TC", sans-serif';
  x = 76; g.fillStyle = '#000'; g.fillText('商業與管理群 ', x, 49); x += g.measureText('商業與管理群 ').width;
  x += hl(x, 49, '多媒體技術科', HEX.blue, HEX.paper); g.fillStyle = '#000'; g.fillText(' 科展', x, 49);
  const bx = 424, pattern = [2, 2, 1, 3, 3, 1, 1, 4];
  for (let px = bx, i = 0; px < 564; i++) { const wdt = pattern[i % 8]; if (i % 2 === 0) { g.fillStyle = '#000'; g.fillRect(px, 0, wdt, 48); } px += wdt; }
  g.font = '400 10px "Space Mono", monospace'; g.fillStyle = '#000';
  g.textAlign = 'left'; g.fillText('115', bx, 62); g.textAlign = 'center'; g.fillText('1205', bx + 70, 62); g.textAlign = 'right'; g.fillText('1219', 564, 62);
});

/* ---------- layered card ---------- */
const layers = [];
function addLayer(root, o) {
  const r = toCard(o.x, o.y, o.w, o.h);
  const geo = new THREE.PlaneGeometry(r.w, r.h);
  const mat = new THREE.MeshBasicMaterial({ map: o.tex || null, color: o.tex ? 0xffffff : o.color, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(r.cx, r.cy, 0.001);
  mesh.renderOrder = 10 + Math.round(o.z * 1000);
  root.add(mesh);
  let shadow = null;
  if (o.shadow !== false) {
    shadow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: o.tex || null, color: 0x000000, transparent: true, opacity: 0, depthWrite: false }));
    shadow.position.set(r.cx, r.cy, 0.0015); shadow.renderOrder = 5;
    root.add(shadow);
  }
  const L = { mesh, shadow, z: o.z * CONFIG.depth, cx: r.cx, cy: r.cy, op: o.op ?? 1, delay: o.delay ?? o.z * 3, glitch: !!o.glitch, gUntil: 0, gdx: 0 };
  layers.push(L);
  return L;
}

/* ---------- cube factory ---------- */
let HATCH;
const TYPES = {
  B: { top: 'hatch', l: COL.blue,   r: COL.black },
  O: { top: COL.orange, l: COL.black, r: COL.blue },
  W: { top: COL.paper, l: 'hatch',  r: COL.blue },
  K: { top: COL.blue,  l: COL.orange, r: COL.black },
  L: { top: COL.paper, l: COL.paper, r: COL.paper },
};
const mat = (v) => v === 'hatch' ? new THREE.MeshBasicMaterial({ map: HATCH }) : new THREE.MeshBasicMaterial({ color: v });
// stack is built Y-up; BoxGeometry faces: [+x, -x, +y(top), -y, +z, -z]
function makeCube(type, s) {
  const t = TYPES[type];
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(s * 0.95, s * 0.95, s * 0.95);
  const body = new THREE.Mesh(geo, [mat(t.l), mat(t.l), mat(t.top), mat(COL.black), mat(t.r), mat(t.r)]);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: COL.black }));
  const glow = new THREE.Mesh(new THREE.BoxGeometry(s * 1.03, s * 1.03, s * 1.03),
    new THREE.MeshBasicMaterial({ color: COL.orange, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  const ghostA = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: COL.orange, transparent: true, opacity: .85, depthWrite: false }));
  const ghostB = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: COL.blue,   transparent: true, opacity: .85, depthWrite: false }));
  ghostA.visible = ghostB.visible = false;
  ghostA.renderOrder = ghostB.renderOrder = 996; glow.renderOrder = 997;
  g.add(ghostA, ghostB, body, edges, glow);
  return { g, glow, ghostA, ghostB };
}

/* ---------- scene ---------- */
async function build(root) {
  await loadFonts();
  HATCH = hatchTexture();

  // paper cover: hides the print so the lifted layers don't double up
  const cover = new THREE.Mesh(new THREE.PlaneGeometry(1, HALF_H * 2),
    new THREE.MeshBasicMaterial({ color: COL.paper, transparent: true, opacity: 0, depthWrite: false }));
  cover.position.z = 0.0005; cover.renderOrder = 1; root.add(cover);

  /* layers: x, y, w, h in design px · z = height above the card */
  // grid paper
  [[30, 196, 150, 220, .02], [392, 470, 178, 170, .025], [52, 600, 120, 150, .018]].forEach(([x, y, w, h, z]) =>
    addLayer(root, { x, y, w, h, z, tex: gridTex(w, h) }));
  // frame + footer
  addLayer(root, { x: 12, y: 26, w: 576, h: 774, z: .012, tex: frameTex(), shadow: false });
  addLayer(root, { x: 18, y: 800, w: 564, h: 64, z: .03, tex: footerTex() });
  // fingerprint rings
  addLayer(root, { x: 70, y: 220, w: 460, h: 470, z: .045, tex: ringTex(460, 470), shadow: false, op: .9 });
  // colour blocks
  addLayer(root, { x: 30, y: 330, w: 64, h: 190, z: .07, color: COL.blue, glitch: true });
  addLayer(root, { x: 470, y: 196, w: 100, h: 54, z: .09, color: COL.blue });
  addLayer(root, { x: 520, y: 250, w: 50, h: 150, z: .06, color: COL.orange, glitch: true });
  addLayer(root, { x: 172, y: 690, w: 70, h: 60, z: .08, color: COL.orange });
  // glitch bars
  addLayer(root, { x: 0, y: 452, w: 600, h: 5, z: .1, color: COL.orange, glitch: true });
  addLayer(root, { x: 330, y: 404, w: 150, h: 26, z: .11, tex: scanTex(150, 26), glitch: true });
  addLayer(root, { x: 96, y: 560, w: 120, h: 10, z: .095, color: COL.blue, glitch: true });
  addLayer(root, { x: 240, y: 600, w: 40, h: 4, z: .1, color: COL.black });
  // bits
  addLayer(root, { x: 40, y: 120, w: 56, h: 56, z: .11, tex: checkTex(56, 56) });
  addLayer(root, { x: 196, y: 586, w: 39, h: 9, z: .12, tex: dotsTex(false, [HEX.blue, HEX.orange, '#000']) });
  addLayer(root, { x: 476, y: 162, w: 9, h: 39, z: .12, tex: dotsTex(true, [HEX.orange, HEX.blue, '#000']) });
  addLayer(root, { x: 430, y: 270, w: 36, h: 36, z: .13, tex: crossTex(36, true), shadow: false });
  addLayer(root, { x: 110, y: 470, w: 30, h: 30, z: .13, tex: crossTex(30), shadow: false });
  addLayer(root, { x: 196, y: 640, w: 30, h: 30, z: .13, tex: crossTex(30), shadow: false });
  // small text
  addLayer(root, { x: 194, y: 210, w: 300, h: 16, z: .1, tex: textTex(300, 16, 'CUBE × LIGHT × PARTICLE × SPACE', '400 11px "Space Mono", monospace', '#000', 3, { y: 12 }) });
  addLayer(root, { x: 546, y: 420, w: 16, h: 250, z: .14, tex: textTex(16, 250, 'PROJECTION MAPPING', '400 12px "Space Mono", monospace', '#000', 6, { rotate: Math.PI / 2, y: 12 }) });
  addLayer(root, { x: 38, y: 532, w: 18, h: 170, z: .14, tex: textTex(18, 170, 'LIGHT · CUBE', '500 13px "Space Grotesk", sans-serif', HEX.blue, 7, { rotate: -Math.PI / 2, y: 13 }) });
  addLayer(root, { x: 360, y: 40, w: 200, h: 120, z: .15, tex: dateTex() });
  // titles: RGB split lives in depth — orange / blue / black sit on separate planes
  const g6 = 6;
  addLayer(root, { x: 36 - g6, y: 40, w: 400, h: 180, z: .15, tex: titleTex(400, 180, '光影', HEX.orange), shadow: false, glitch: true });
  addLayer(root, { x: 36 + g6, y: 40, w: 400, h: 180, z: .17, tex: titleTex(400, 180, '光影', HEX.blue), shadow: false, glitch: true });
  addLayer(root, { x: 36, y: 40, w: 400, h: 180, z: .19, tex: titleTex(400, 180, '光影', '#000', { top: .46, size: .1, dx: 22 }), glitch: true });
  addLayer(root, { x: 186, y: 152, w: 46, h: 46, z: .21, color: COL.blue });
  addLayer(root, { x: 236 + g6, y: 610, w: 364, h: 180, z: .15, tex: titleTex(364, 180, '立方', HEX.orange), shadow: false, glitch: true });
  addLayer(root, { x: 236 - g6, y: 610, w: 364, h: 180, z: .17, tex: titleTex(364, 180, '立方', HEX.blue), shadow: false, glitch: true });
  addLayer(root, { x: 236, y: 610, w: 364, h: 180, z: .19, tex: titleTex(364, 180, '立方', '#000', { top: .22, size: .08, dx: -18 }), glitch: true });

  // calibration frame flash
  const fw = 0.47, fh = HALF_H - 0.02;
  const frame = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-fw, -fh, 0.002), new THREE.Vector3(fw, -fh, 0.002), new THREE.Vector3(fw, fh, 0.002), new THREE.Vector3(-fw, fh, 0.002)]),
    new THREE.LineBasicMaterial({ color: COL.orange, transparent: true, opacity: 0 }));
  root.add(frame);

  // horizontal projector scan line sweeping down through all layers
  const scan = new THREE.Mesh(new THREE.PlaneGeometry(1.04, 0.006),
    new THREE.MeshBasicMaterial({ color: COL.orange, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  scan.renderOrder = 999; root.add(scan);

  /* ---- isometric cube stack, floating above the card ---- */
  const s = CONFIG.cubeSize;
  const stackPos = toCard(105, 236, 390, 421);
  const tilt = new THREE.Group();                // tilt top toward viewer = isometric look
  tilt.position.set(stackPos.cx, stackPos.cy, 0.02);
  tilt.rotation.x = 0.6155;
  root.add(tilt);
  const yaw = new THREE.Group(); yaw.rotation.y = Math.PI / 4; tilt.add(yaw);

  const layout = [
    [0,0,0,'B'],[1,0,0,'O'],[0,1,0,'W'],[1,1,0,'B'],[2,0,0,'W'],[0,2,0,'O'],[2,1,0,'K'],
    [0,0,1,'K'],[1,0,1,'B'],[0,1,1,'O'],
    [0,0,2,'W'],
  ];
  const cubes = layout.map(([i, j, k, type]) => {
    const c = makeCube(type, s);
    // i → +x, j → +z (toward viewer), k → up
    c.home = new THREE.Vector3((i - 0.8) * s, (k - 1) * s, (j - 0.8) * s);
    c.dir = c.home.clone().normalize();
    c.k = k; c.delay = 0.5 + (k * 3 + i + j) * 0.08;
    c.glitchUntil = 0; c.glitchDX = 0;
    c.g.scale.setScalar(0.001);
    yaw.add(c.g);
    return c;
  });
  const minis = [['O', 0.24, 0.22, 0.10], ['L', -0.26, 0.16, -0.12], ['K', 0.22, -0.2, 0.16], ['W', -0.2, -0.18, 0.2]].map(([t, x, y, z], n) => {
    const c = makeCube(t, s * 0.4); c.home = new THREE.Vector3(x, y, z); c.g.scale.setScalar(0.001); c.n = n;
    yaw.add(c.g); return c;
  });

  // digital particles rising out of the card
  const makeParticles = (n, color) => {
    const pos = new Float32Array(n * 3), spd = new Float32Array(n);
    for (let p = 0; p < n; p++) {
      pos[p*3] = (Math.random() - .5) * 0.9; pos[p*3+1] = (Math.random() - .5) * 1.3; pos[p*3+2] = Math.random() * 0.4;
      spd[p] = 0.03 + Math.random() * 0.1;
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: 0.008, transparent: true, opacity: 0, depthWrite: false }));
    pts.userData.spd = spd; pts.renderOrder = 998; root.add(pts); return pts;
  };
  const partsA = makeParticles(Math.floor(CONFIG.particles / 2), COL.orange);
  const partsB = makeParticles(Math.ceil(CONFIG.particles / 2), COL.blue);

  return { cover, frame, scan, tilt, yaw, cubes, minis, partsA, partsB, s };
}

/* ---------- animation ---------- */
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const rand = (a, b) => a + Math.random() * (b - a);

function animate(S, t, dt, now) {
  // 1) cover fades in instantly so print and 3D layers line up, then layers peel up
  S.cover.material.opacity = clamp01(t / 0.25);
  layers.forEach((L) => {
    const p = clamp01((t - 0.25 - L.delay) / 0.9);
    const e = p ? easeOutBack(p) : 0;
    const z = 0.001 + L.z * e + Math.sin(now * 1.3 + L.z * 40) * 0.005 * p * CONFIG.depth;
    const glitching = L.glitch && now < L.gUntil;
    L.mesh.position.set(L.cx + (glitching ? L.gdx : 0), L.cy, z);
    L.mesh.material.opacity = L.op * clamp01(t / 0.25);
    if (L.shadow) {
      // light from upper-left: the higher the layer, the further its shadow falls
      L.shadow.position.set(L.cx + z * 0.22, L.cy - z * 0.22, 0.0015);
      L.shadow.material.opacity = 0.16 * p;
    }
  });

  // 2) cube stack: rise out of the card, then sway and periodically explode
  const lift = easeOutCubic(clamp01((t - 0.5) / 1.2));
  S.tilt.position.z = 0.02 + CONFIG.cubeLift * lift * CONFIG.depth;
  S.yaw.rotation.y = Math.PI / 4 + Math.sin(now * 0.6) * CONFIG.sway * clamp01((t - 1.6) / 1);
  const cyc = (now % CONFIG.explodeEvery) / CONFIG.explodeEvery;
  const burst = t > 2.5 && cyc > 0.75 ? Math.sin((cyc - 0.75) / 0.25 * Math.PI) : 0;
  const s = S.s;
  S.cubes.forEach((c) => {
    const p = clamp01((t - c.delay) / 0.7), e = p ? easeOutBack(p) : 0;
    c.g.scale.setScalar(Math.max(0.001, e));
    const spread = burst * s * 0.9;
    const glitching = now < c.glitchUntil;
    c.g.position.set(
      c.home.x + c.dir.x * spread + (glitching ? c.glitchDX : 0),
      c.home.y + c.dir.y * spread + Math.sin(now * 1.6 + c.delay * 9) * 0.003,
      c.home.z + c.dir.z * spread);
    c.ghostA.visible = c.ghostB.visible = glitching;
    if (glitching) { c.ghostA.position.x = -0.016; c.ghostB.position.x = 0.016; }
    // light wave climbing layer by layer
    const wave = (now * 0.8) % 1.4;
    c.glow.material.opacity = Math.max(0, 1 - Math.abs(c.k * 0.4 - wave) / 0.25) * 0.5 * p;
  });
  S.minis.forEach((c) => {
    const p = clamp01((t - 1.6 - c.n * 0.15) / 0.6);
    c.g.scale.setScalar(Math.max(0.001, p ? easeOutBack(p) : 0));
    c.g.position.set(c.home.x, c.home.y + Math.sin(now * 1.2 + c.n) * 0.02, c.home.z);
    c.g.rotation.x += dt * 0.9; c.g.rotation.y += dt * 0.6;
  });

  // 3) projector scan line + particles + calibration frame
  const sc = (now % 3.2) / 3.2;
  S.scan.position.set(0, HALF_H - sc * HALF_H * 2, 0.12 * CONFIG.depth);
  S.scan.material.opacity = 0.8 * clamp01((t - 1.2) / 0.5);
  [S.partsA, S.partsB].forEach((pts) => {
    const pos = pts.geometry.attributes.position.array, spd = pts.userData.spd;
    for (let i = 0; i < spd.length; i++) {
      pos[i*3+2] += spd[i] * dt;
      if (pos[i*3+2] > 0.4) { pos[i*3+2] = 0; pos[i*3] = (Math.random() - .5) * 0.9; pos[i*3+1] = (Math.random() - .5) * 1.3; }
    }
    pts.geometry.attributes.position.needsUpdate = true;
    pts.material.opacity = 0.9 * clamp01((t - 1.0) / 0.8);
  });
  S.frame.material.opacity = t < 0.6 ? (Math.floor(t * 20) % 2 ? 1 : 0.2) : 0;
}

function scheduleGlitch(S, now) {
  // layers
  const gl = layers.filter((L) => L.glitch);
  const nL = 1 + Math.floor(Math.random() * 3);
  for (let q = 0; q < nL; q++) {
    const L = gl[Math.floor(Math.random() * gl.length)];
    L.gdx = rand(-0.03, 0.03); L.gUntil = now + rand(0.06, 0.18);
  }
  // cubes
  if (Math.random() < 0.35) {
    const k = Math.floor(Math.random() * 2), dx = rand(-0.05, 0.05), until = now + rand(0.08, 0.18);
    S.cubes.filter((c) => c.k === k).forEach((c) => { c.glitchDX = dx; c.glitchUntil = until; });
  } else {
    const n = 1 + Math.floor(Math.random() * 2);
    for (let q = 0; q < n; q++) {
      const c = S.cubes[Math.floor(Math.random() * S.cubes.length)];
      c.glitchDX = rand(-0.04, 0.04); c.glitchUntil = now + rand(0.06, 0.2);
    }
  }
}

/* ---------- preflight: find the real reason before starting ---------- */
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/i.test(UA);
const IS_ANDROID = /Android/i.test(UA);
// Android WebViews (in-app browsers) carry "; wv)" or "Version/x.x Chrome"
const IN_APP = /Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|Discord|Telegram|GSA\/|; wv\)/i.test(UA)
  || (IS_ANDROID && /Version\/\d/.test(UA) && /Chrome\//.test(UA));
const IS_REAL_CHROME = IS_ANDROID && /Chrome\/\d/.test(UA) && !IN_APP && !/SamsungBrowser|EdgA|OPR|Firefox/i.test(UA);
function browserName() {
  if (IN_APP) return '內建瀏覽器（App 內開啟）';
  if (/SamsungBrowser/i.test(UA)) return 'Samsung Internet';
  if (/EdgA/i.test(UA)) return 'Edge';
  if (/Firefox/i.test(UA)) return 'Firefox';
  if (IS_REAL_CHROME) return 'Chrome';
  if (IS_IOS && /CriOS/i.test(UA)) return 'Chrome (iOS)';
  if (IS_IOS) return 'Safari';
  return '未知瀏覽器';
}
function addOpenInChrome() {
  if (!IS_ANDROID || IS_REAL_CHROME) return;
  const m = $('#msg');
  const a = document.createElement('a');
  a.href = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
  a.textContent = '用 Chrome 開啟 →';
  a.style.cssText = 'display:block;margin-top:12px;background:#FF9505;color:#000;text-align:center;font-weight:900;padding:12px;text-decoration:none;font-size:16px';
  m.appendChild(a);
}
const MSG = {
  inapp: '你正在 LINE／IG／FB 的內建瀏覽器裡，這類瀏覽器通常不能開相機。請點右上角「⋯」→「用預設瀏覽器開啟」，改用 Safari 或 Chrome。',
  insecure: '這個網址不是 https，手機不允許開相機。請改用 https:// 開頭的網址。',
  nomedia: '這個瀏覽器不支援相機存取。請改用 Safari（iPhone）或 Chrome（Android）開啟。',
  notarget: '還沒有 AR 辨識檔（targets.mind），所以目前無法辨識酷卡。這不是相機權限的問題：等正面定稿、上傳 targets.mind 之後就能使用。',
  denied: IS_IOS
    ? '相機權限被拒絕。iPhone：點網址列左邊的「大小」(aA) →「網站設定」→ 相機改成「允許」，然後重新整理；或到「設定 › Safari › 相機」改成「詢問」或「允許」。'
    : '相機被拒絕。如果手機設定裡相機權限是開著的，通常代表你不是在 Chrome 裡開啟（例如從 LINE、掃碼 App、Google 智慧鏡頭點開）。請按下方按鈕改用 Chrome 開啟；若已經在 Chrome，請到 Chrome ⋮ › 設定 › 網站設定 › 相機，確認本網站不在「已封鎖」。',
  nocam: '找不到可用的相機。',
  busy: '相機正被其他 App 使用中，請關掉其他用到相機的 App 後再試一次。',
};
class ARError extends Error { constructor(code, detail) { super(code); this.code = code; this.detail = detail; } }

async function preflight() {
  if (!window.isSecureContext) throw new ARError('insecure');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new ARError(IN_APP ? 'inapp' : 'nomedia');
  const r = await fetch(CONFIG.target, { method: 'HEAD', cache: 'no-store' }).catch(() => null);
  if (!r || !r.ok) throw new ARError('notarget');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') throw new ARError(IN_APP ? 'inapp' : 'denied', n);
    if (n === 'NotFoundError' || n === 'OverconstrainedError') throw new ARError('nocam', n);
    if (n === 'NotReadableError' || n === 'AbortError') throw new ARError('busy', n);
    throw new ARError('unknown', n || String(e));
  }
  stream.getTracks().forEach((t) => t.stop());
}

async function cameraPermState() {
  try { return (await navigator.permissions.query({ name: 'camera' })).state; } catch (e) { return 'n/a'; }
}

if (IN_APP) { showMsg(MSG.inapp); addOpenInChrome(); }

/* ---------- boot ---------- */
async function startAR() {
  const btn = $('#go'); btn.disabled = true; btn.textContent = '啟動中…';
  $('#msg').classList.remove('on');
  try {
    await preflight();
  } catch (e) {
    btn.disabled = false; btn.textContent = '重試';
    const perm = await cameraPermState();
    showMsg((MSG[e.code] || 'AR 啟動失敗。') +
      '\n\n[診斷] ' + browserName() + '｜錯誤：' + (e.detail || e.code) + '｜相機權限狀態：' + perm);
    $('#msg').style.whiteSpace = 'pre-line';
    if (['inapp', 'denied', 'nomedia', 'unknown'].includes(e.code)) addOpenInChrome();
    return;
  }
  const mindar = new MindARThree({
    container: $('#ar'),
    imageTargetSrc: CONFIG.target,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    filterMinCF: 0.0001, filterBeta: 0.01,
  });
  const { renderer, scene, camera } = mindar;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const anchor = mindar.addAnchor(0);
  const S = await build(anchor.group);

  let found = false, t = 0, nextGlitch = 0;
  anchor.onTargetFound = () => { found = true; t = 0; $('#scan').classList.remove('on'); if (navigator.vibrate) navigator.vibrate(30); };
  anchor.onTargetLost = () => { found = false; $('#scan').classList.add('on'); };

  try {
    await mindar.start();
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = '重新開啟相機';
    showMsg('AR 啟動失敗（' + ((err && (err.name || err.message)) || 'unknown') + '）。請重新整理後再試一次。');
    return;
  }
  $('#start').style.display = 'none';
  $('#scan').classList.add('on');

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), now = clock.elapsedTime;
    if (found) {
      t += dt;
      if (now > nextGlitch) { scheduleGlitch(S, now); nextGlitch = now + rand(...CONFIG.glitchEvery); }
      animate(S, t, dt, now);
    }
    renderer.render(scene, camera);
  });
}

$('#go').addEventListener('click', () => {
  startAR().catch((e) => {
    console.error(e);
    showMsg('載入失敗：請確認 targets.mind 已放在網頁同一個資料夾，然後重新整理。');
    const b = $('#go'); b.disabled = false; b.textContent = '重試';
  });
});
</script>
